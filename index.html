<script>
  const HASH_CORRETO = "197496d4514ca9bbfb27b52b5098cf92f78e099d73583851e45f55846b0b3abb";
  const CHAVE_STORAGE = "hugo_taxi_dispositivo_autorizado";

  if (localStorage.getItem(CHAVE_STORAGE) === HASH_CORRETO) {
    document.getElementById("tela-bloqueio").style.display = "none";
  }

  async function gerarHash(texto) {
    const encoder = new TextEncoder();
    const data = encoder.encode(texto);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function verificarSenha() {
    const input = document.getElementById("input-senha");
    const hashDigitado = await gerarHash(input.value);

    if (hashDigitado === HASH_CORRETO) {
      localStorage.setItem(CHAVE_STORAGE, HASH_CORRETO);
      document.getElementById("tela-bloqueio").style.display = "none";
    } else {
      document.getElementById("msg-erro").style.display = "block";
      input.value = "";
      input.focus();
    }
  }

  document.getElementById("input-senha").addEventListener("keypress", function(e) {
    if (e.key === "Enter") verificarSenha();
  });
</script>

        function txt_to_number(txt) {
            txt = txt + "";
            if (txt.includes(",")) { txt = txt.replace(",", "."); }
            return txt.includes(".") ? parseFloat(txt) : parseInt(txt) || 0;
        }

        function format_decimal_number(number, places, virgula = false) {
            number = parseFloat(number) || 0;
            number = number.toFixed(places);
            if (virgula) { number = number.replace(".", ","); }
            return number;
        }

            const meta = document.getElementById('meta-theme-color');
            if (tema === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if (icone) icone.className = 'bi bi-sun-fill text-warning';
                if (texto) texto.textContent = 'Modo Claro';

            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                if (icone) icone.className = 'bi bi-moon-stars-fill text-primary';
                if (texto) texto.textContent = 'Modo Escuro';

            }
